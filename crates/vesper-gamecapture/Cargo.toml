[package]
name = "vesper-gamecapture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# No doc-tests: skips an empty rustdoc run per `cargo test`.
doctest = false

[dependencies]
libc = "0.2"
tracing = "0.1"
vesper-core.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vesper-encode.workspace = true
