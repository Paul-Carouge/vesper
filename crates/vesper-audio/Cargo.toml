[package]
name = "vesper-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# No doc-tests: skips an empty rustdoc run per `cargo test`.
doctest = false

[dependencies]
ffmpeg-next.workspace = true
libc = "0.2"
pipewire = { version = "0.10", features = ["v0_3_50"] }
tracing = "0.1"
vesper-core.workspace = true
vesper-dsp.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
