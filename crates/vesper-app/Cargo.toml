[package]
name = "vesper-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vesper"
path = "src/main.rs"

[dependencies]
# `~`: `unstable-winit-030` (window focus) may change in any minor release.
slint = { version = "~1.18", features = ["unstable-winit-030"] }
dirs = "7"
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "file_chooser", "notification"] }
futures-lite = "2"
# The Secret Service client (stream key); already in the tree through ashpd.
zbus = { version = "5", default-features = false, features = ["async-io"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The version and features Slint's own tray already builds: no extra crate.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
wayland-client = "0.31"
vesper-core.workspace = true
vesper-capture.workspace = true
vesper-encode.workspace = true
vesper-mux.workspace = true
vesper-audio.workspace = true
vesper-dsp.workspace = true
vesper-vst.workspace = true
vesper-gamecapture.workspace = true
vesper-compose.workspace = true
# Scene overlays. All three are in the tree already (Slint): no new crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.48", default-features = false, features = ["text"] }
# `fs`: `load_system_fonts` (font files are read on demand, not mapped).
fontdb = { version = "0.24", default-features = false, features = ["fs"] }

[dev-dependencies]
# The GPU test-pattern producer of vesper-encode's tests, and reading files back.
ffmpeg-next.workspace = true

[build-dependencies]
slint-build = "~1.18"
