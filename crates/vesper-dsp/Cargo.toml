[package]
name = "vesper-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# No doc-tests: skips an empty rustdoc run per `cargo test`.
doctest = false

[dependencies]
# Pure-Rust RNNoise port (BSD-3-Clause). Without default features it skips
# the CLI dependencies (clap, hound, dasp).
nnnoiseless = { version = "0.5.2", default-features = false }
