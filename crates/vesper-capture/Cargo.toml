[package]
name = "vesper-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# No doc-tests: skips an empty rustdoc run per `cargo test`.
doctest = false

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
async-io = "2"
futures-lite = "2"
ffmpeg-next.workspace = true
libc = "0.2"
pipewire = { version = "0.10", features = ["v0_3_33"] }
tracing = "0.1"
vesper-core.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
