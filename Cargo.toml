[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vesper-core = { path = "crates/vesper-core" }
vesper-capture = { path = "crates/vesper-capture" }
vesper-encode = { path = "crates/vesper-encode" }
vesper-mux = { path = "crates/vesper-mux" }
vesper-audio = { path = "crates/vesper-audio" }
vesper-gamecapture = { path = "crates/vesper-gamecapture" }
vesper-dsp = { path = "crates/vesper-dsp" }
vesper-vst = { path = "crates/vesper-vst" }
vesper-compose = { path = "crates/vesper-compose" }
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
